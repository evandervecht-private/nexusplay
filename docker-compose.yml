services:
  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexusplay
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: nexusplay_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusplay -d nexusplay_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: nexusplay-assets
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Creates the S3 bucket and sets public read policy
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/nexusplay-assets &&
        mc anonymous set download local/nexusplay-assets/public &&
        echo 'MinIO bucket ready'
      "

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    logging:
      driver: none    # silence verbose mailhog logs

  # ── Applications ───────────────────────────────────────────────────────────

  api:
    build:
      context: ./apps/api
      target: dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api/src:/app/src:delegated
      - ./packages:/packages:delegated
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://nexusplay:dev@postgres:5432/nexusplay_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-min-32-chars-long-here
      JWT_REFRESH_SECRET: dev-refresh-secret-min-32-chars-long
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@nexusplay.local
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY: minioadmin
      R2_SECRET_KEY: minioadmin
      R2_BUCKET: nexusplay-assets
      R2_PUBLIC_URL: http://localhost:9000/nexusplay-assets
      PAYPAL_CLIENT_ID: sandbox-client-id
      PAYPAL_CLIENT_SECRET: sandbox-client-secret
      PAYPAL_MODE: sandbox
      MOLLIE_API_KEY: test_placeholder
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ws:
    build:
      context: ./apps/ws
      target: dev
    restart: unless-stopped
    ports:
      - "2567:2567"
    volumes:
      - ./apps/ws/src:/app/src:delegated
    environment:
      NODE_ENV: development
      PORT: 2567
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-min-32-chars-long-here
      API_URL: http://api:3001
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2567/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./apps/web
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/src:delegated
      - ./apps/web/app:/app/app:delegated
      - ./apps/web/public:/app/public:delegated
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:2567
      NEXT_PUBLIC_R2_URL: http://localhost:9000/nexusplay-assets
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-nextauth-secret-min-32-chars-here
      DATABASE_URL: postgresql://nexusplay:dev@postgres:5432/nexusplay_dev
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Dev Tools (opt-in) ─────────────────────────────────────────────────────

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    profiles:
      - tools
    depends_on:
      - postgres

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  default:
    name: nexusplay-dev
