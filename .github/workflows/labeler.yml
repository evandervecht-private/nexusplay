name: Auto Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-pr:
    name: Label Pull Request
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Label by changed files
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true

  label-issue:
    name: Label Issue by Title/Body
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Label by phase prefix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';
            const body = issue.body || '';
            const labelsToAdd = [];

            // Phase labels from title prefix
            const phaseMatch = title.match(/^\[P(\d+)\]/);
            if (phaseMatch) {
              const phase = parseInt(phaseMatch[1]);
              const phaseLabels = {
                1: 'phase-1',
                2: 'phase-2',
                3: 'phase-3',
                4: 'phase-4',
                5: 'phase-5',
                6: 'phase-6',
                7: 'phase-7',
                8: 'phase-8',
                9: 'phase-9',
                10: 'phase-10',
              };
              if (phaseLabels[phase]) labelsToAdd.push(phaseLabels[phase]);
            }

            // Domain labels from title/body keywords
            const content = (title + ' ' + body).toLowerCase();

            const domainRules = [
              { keywords: ['frontend', 'ui', 'ux', 'react', 'next.js', 'page', 'component', 'design'], label: 'frontend' },
              { keywords: ['backend', 'api', 'fastify', 'endpoint', 'route', 'server'], label: 'backend' },
              { keywords: ['multiplayer', 'colyseus', 'websocket', 'room', 'lobby', 'matchmaking'], label: 'multiplayer' },
              { keywords: ['payment', 'paypal', 'mollie', 'ideal', 'wero', 'stripe', 'checkout', 'billing'], label: 'payment' },
              { keywords: ['security', 'auth', 'jwt', 'oauth', 'ciso', 'vulnerability', 'cve', 'xss', 'csrf', 'gdpr'], label: 'security' },
              { keywords: ['seo', 'search engine', 'metadata', 'sitemap', 'structured data', 'lighthouse', 'core web vitals'], label: 'seo' },
              { keywords: ['infrastructure', 'railway', 'vercel', 'supabase', 'deploy', 'ci/cd', 'docker'], label: 'infra' },
              { keywords: ['database', 'prisma', 'postgresql', 'schema', 'migration', 'query', 'index'], label: 'database' },
              { keywords: ['test', 'testing', 'playwright', 'vitest', 'jest', 'e2e', 'unit test'], label: 'testing' },
            ];

            for (const rule of domainRules) {
              if (rule.keywords.some(kw => content.includes(kw))) {
                labelsToAdd.push(rule.label);
              }
            }

            // Priority labels from title
            if (title.includes('[P1-CRITICAL]') || title.includes('critical') || title.includes('security breach') || title.includes('payment fail')) {
              labelsToAdd.push('P1-critical');
            } else if (content.includes('p1-critical') || content.includes('agent: ciso')) {
              labelsToAdd.push('P1-critical');
            } else if (content.includes('p2-high')) {
              labelsToAdd.push('P2-high');
            } else if (content.includes('p3-medium')) {
              labelsToAdd.push('P3-medium');
            }

            // Agent labels from body
            const agentRules = [
              { keyword: 'agent: cto', label: 'infra' },
              { keyword: 'agent: ciso', label: 'security' },
              { keyword: 'agent: seo agent', label: 'seo' },
              { keyword: 'agent: controller', label: 'payment' },
            ];
            for (const rule of agentRules) {
              if (content.includes(rule.keyword)) {
                labelsToAdd.push(rule.label);
              }
            }

            // Deduplicate
            const uniqueLabels = [...new Set(labelsToAdd)];

            if (uniqueLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: uniqueLabels,
              });
              console.log(`Added labels: ${uniqueLabels.join(', ')}`);
            }
